<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MJ Royal mobile layout check</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;display:grid;justify-items:center;gap:12px;background:#292a28;color:#fff;font:14px system-ui}.tools{height:48px;display:flex;align-items:center;gap:12px}button{min-height:40px;padding:8px 12px;border:1px solid #777;color:white;background:#151515;cursor:pointer}iframe{display:block;border:0;background:#111;width:390px;height:844px}#size{min-width:90px;text-align:center}</style></head><body><div class="tools"><button data-width="320">320 px</button><button data-width="390">390 px</button><button data-width="430">430 px</button><button data-width="768">768 px</button><button id="intro">Intro</button><button id="home">Home</button><span id="size">390 × 844</span></div><iframe id="phone" title="Phone preview of MJ Royal" src="/"></iframe><script>const phone=document.getElementById('phone');document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>{const w=Number(button.dataset.width),h=w===320?568:844;phone.style.width=w+'px';phone.style.height=h+'px';document.getElementById('size').textContent=w+' × '+h});document.getElementById('intro').onclick=()=>phone.src='/?intro=preview';document.getElementById('home').onclick=()=>phone.src='/';</script></body></html>
